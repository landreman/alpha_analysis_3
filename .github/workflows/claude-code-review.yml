name: Claude Code Review

on:
  pull_request:
    # Open draft PRs; readiness requests one deliberate review pass.
    # Do not spend a review on every push or on draft creation.
    types: [ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MPLBACKEND: Agg

jobs:
  claude-review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Check review credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Add the CLAUDE_CODE_OAUTH_TOKEN repository secret and enable Claude App access. See docs/DEVELOPMENT.md."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install review verification environment
        run: python -m pip install -e '.[dev]'
      - name: Run adversarial milestone review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read .claude/commands/review-milestone.md and perform its adversarial
            review of this PR against its base branch. Follow AGENTS.md and the
            current docs/DESIGN.md and docs/STATUS.md. This is alpha_analysis_3:
            do not impose the earlier repositories' certification contracts.

            Post a top-level PR comment with a plain-language summary, actionable
            findings and the scoped merge/fix-first/needs-ADR verdict, even if
            there are no findings. Add confirmed inline findings when useful.
          claude_args: |
            --model opus
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(make*),Bash(pytest*),Bash(python*),Bash(black*),mcp__github_inline_comment__create_inline_comment"
