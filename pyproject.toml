[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-analysis-3"
version = "0.1.0"
description = "Ridge-surface computation of the constant-J alpha-particle loss surrogate for stellarators"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Matt Landreman"}]
# Base dependencies are the researcher-approved set (docs/DESIGN.md section 1).
# contourpy performs the ridge extraction (marching squares); matplotlib makes the
# required diagnostic plots; numba compiles the kernels.
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "numba>=0.59",
    "contourpy>=1.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-xdist>=3"]
dev = ["alpha-analysis-3[test]", "black>=24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: excluded from the fast tier; the full tier stays under 300 seconds"]
addopts = "--strict-markers --tb=short"

[tool.black]
line-length = 88
target-version = ["py310"]
